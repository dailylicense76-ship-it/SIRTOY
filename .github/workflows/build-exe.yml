name: Build Windows Desktop EXE

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch: # Allows manual trigger from GitHub web interface ("Run workflow" button)

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Compile Production Web Assets
        run: npm run build

      - name: Install Electron & Electron Builder
        run: npm install --save-dev electron@latest electron-builder@latest

      - name: Build Windows .EXE (Setup & Portable)
        run: |
          npx electron-builder --windows --config.win.target=nsis,portable --config.productName="Sirtoy Lending Plus" --config.appId="com.sirtoy.lendingplus" --config.directories.output="release" --config.files="dist/**/*,electron-main.cjs,public/**/*" --config.main="electron-main.cjs"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sirtoy-Lending-Plus-Windows-EXE
          path: release/*.exe
          retention-days: 30

      - name: Create GitHub Release (Optional for Tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
