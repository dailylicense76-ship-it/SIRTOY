name: Build Windows Desktop EXE

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Compile Production Web Assets
        run: npm run build

      - name: Install Electron & Electron Builder
        run: npm install --save-dev electron@latest electron-builder@latest electron-updater@latest --legacy-peer-deps

      - name: Build Windows .EXE (Setup & Portable)
        run: npx electron-builder --win --config electron-builder.json --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload .EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Loan-Management-System-Windows-EXE
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          retention-days: 30

      - name: Extract Version from package.json
        id: pkg_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Release version: ${VERSION}"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg_version.outputs.version }}
          name: Loan Management System v${{ steps.pkg_version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
